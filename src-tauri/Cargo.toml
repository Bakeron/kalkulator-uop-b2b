[package]
name = "kalkulator-uop-b2b"
version = "0.1.0"
description = "Kalkulator UoP i B2B - compares a Polish employment contract with a B2B contract"
authors = ["Szymon Bakonis"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name different from the bin name (needed on Windows,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "kalkulator_uop_b2b_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
